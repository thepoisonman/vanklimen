<style>
.carousel-container {
  position: relative;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  overflow: hidden;
}

.carousel-slide {
  display: flex;
  transition: transform 0.5s ease;
}

.carousel-slide img {
  width: 100%;
  flex-shrink: 0;
}

.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.4);
  border: none;
  padding: 10px 15px;
  color: white;
  cursor: pointer;
}

.carousel-btn.prev { left: 10px; }
.carousel-btn.next { right: 10px; }
</style>

<div class="carousel-container" id="carousel-{{ .Ordinal }}">
  <div class="carousel-slide">
    {{ range .Params }}
    <img src="{{ . }}" alt="">
    {{ end }}
  </div>

  <button class="carousel-btn prev">‹</button>
  <button class="carousel-btn next">›</button>
</div>

<script>
(function() {
  const root = document.getElementById("carousel-{{ .Ordinal }}");
  const slide = root.querySelector(".carousel-slide");
  const images = slide.querySelectorAll("img");
  const prev = root.querySelector(".prev");
  const next = root.querySelector(".next");

  let index = 0;
  let autoplayInterval = null;
  const delay = 4000; // Cambia el tiempo del autoplay (ms): 4000 = 4 segundos

  function update() {
    slide.style.transform = "translateX(" + (-index * 100) + "%)";
  }

  function startAutoplay() {
    autoplayInterval = setInterval(() => {
      index = (index + 1) % images.length;
      update();
    }, delay);
  }

  function stopAutoplay() {
    clearInterval(autoplayInterval);
  }

  // Botones manuales
  next.onclick = () => {
    stopAutoplay();
    index = (index + 1) % images.length;
    update();
    startAutoplay();
  };

  prev.onclick = () => {
    stopAutoplay();
    index = (index - 1 + images.length) % images.length;
    update();
    startAutoplay();
  };

  // Pausar autoplay cuando el mouse está arriba del carousel
  root.addEventListener("mouseenter", stopAutoplay);
  root.addEventListener("mouseleave", startAutoplay);

  // Iniciar autoplay
  startAutoplay();

})();
</script>
