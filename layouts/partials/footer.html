<footer>
    <div class="site-footer">
        <!-- Site Title and Copyright -->
        <div>
        {{ if eq .Section "old" }}
        <p class="footer-title">
        {{ now.Format "2006" }} - "{{ .Site.Title }}" y "{{ .Site.Params.homeText }}"  <br>
        licenciados bajo <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/sa.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;">
        </p>
        {{ else }}
        <p class="footer-title">
        © {{ now.Format "2006" }} {{ .Site.Title }} · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>
        </p>
        {{ end }}
        </div>
        <!-- Contact Link -->
        <nav class="footer-links">
            <!-- This uses the relref function to create a reliable internal link to your contact page -->
            {{ if eq .Section "old" }}
              <a href="{{ relref . "/old/contact.md" }}">Contacto</a>
            {{ else }}
              <a href="{{ "old/" | relURL }}">Versión anterior</a>
            {{ end }}
        </nav>
    </div>
</footer>
