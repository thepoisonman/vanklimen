      <template data-index="0" data-titulo="El embrujo"><p>Deambula por las calles
tratando de curar el embrujo
que hizo su cuerpo de chapa
mientras el cielo se nublaba</p>
<p>Y sube al techo a rezarle a una nube
piensa que así está más cerca de Dios
alza las manos rogando a la lluvia
que por favor le regale el perdón</p>
<p>Mojando la almohada,
el llanto deja su dolor
¡Rompe ya las sábanas!
Mañana espera el neuvo olor</p>
</template>
    
      <template data-index="1" data-titulo="El centinela"><p>Vive en el cuarto
que se ve desde la esquina
yo lo oigo recitar
las palabras imperfectas,
pero justas,
para este crepitar</p>
<p>Una leve estela de luz
se filtró por el umbral
y el humo no paraba de brotar</p>
<p>El centinela
aguarda
la noche en que sus ojos
pardos
se fundan en la ficción
encuentren
un nuevo despertar</p>
<p>Cruza el pasillo
y al llegar hasta la puerta
suelta el hilo que al volver
lo llevará, de nuevo,
al verso que tal vez
esta noche podrá ser</p>
</template>
    
      <template data-index="2" data-titulo="Lo que el día le negó"><p>Es mi amigo
es mi hermano
es de mi sangre
es mi dolor</p>
<p>Es la tormenta
es un salto al cordón
es la ternura
el silbido cuando entró</p>
<p>Aquel que por las noches
sube hasta el altillo
bailando ante la luna
le pide por favor
que se quede un ratito
que no lo deje solo
que le regale siempre
un viento como aquel</p>
<p>Lo que el día le negó</p>
</template>
    
      <template data-index="3" data-titulo="La vida que marcha igual"><p>Lunes es el primer día
en que comencé a sangrar
lavé con agua la herida
ardí y me amarré al compás</p>
<p>Martes y los demás días,
parecen decantar
la inercia que cubre todo
la vida que marcha igual</p>
<p>Llega la noche del domingo
llega blandiendo tu recuerdo</p>
<p>Te sientas junto a mí
volvemos a cantar
volvemos a brindar</p>
<p>¡Tu partida!</p>
<p>Lunes llega con el llanto
y ese eterno deambular
lata siempre abierta al cielo
bebe por disimular</p>
<p>Martes y los demás días
parecen retratar
el terco fluir del tiempo
la vida que marcha igual</p>
</template>
    
      <template data-index="4" data-titulo="La sed"><p>Le digo a usted señor
que en la barra
ejerce la última salvación
que nosotros acá
volteados hasta no poder más
que empezamos a tomar
cuando ni la vida empezó
ni la noche mucho menos
mucho menos pero nunca antes (que)</p>
<p>La sed,
la primera,
la que guía
nuestro cuerpo en el vals
que se baila sin saberlo bailar
que se canta sin poderlo cantar</p>
<p>¡Cantar!</p>
<p>Prosiga usted señor,
si es que quiere,
dejar de escuchar mi sermón
yo sé que no he parado de hablar
que la lengua se me tuerce pensando
que hoy esta noche
encontré el rumbo de una canción
una más, la de siempre
la que siempre brinda por</p>
<p>La sed,
la primera,
la que guía
nuestro cuerpo en el vals
que se baila sin saberlo bailar
que se canta sin poderlo cantar</p>
<p>Le decía que se olvide,
le decía ya no importa
Solamente alcemos las copas</p>
<p>por las sed&hellip;</p>
</template>
